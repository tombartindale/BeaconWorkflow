services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    command: ["--root", "/data/programme", "--data-dir", "/data/ui-state", "--port", "8420", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgres://beacon:${POSTGRES_PASSWORD:-beacon}@postgres:5432/beacon
      REDIS_URL: redis://redis:6379
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-northumbria.ac.uk}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-beacon@localhost}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    volumes:
      - programme-root:/data/programme
      - ui-state:/data/ui-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["node", "/app/ui/server/dist/worker.js"]
    environment:
      BEACON_ROOT: /data/programme
      DATABASE_URL: postgres://beacon:${POSTGRES_PASSWORD:-beacon}@postgres:5432/beacon
      REDIS_URL: redis://redis:6379
      BCN: /app/tooling/.venv/bin/bcn
    volumes:
      - programme-root:/data/programme
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
      POSTGRES_DB: beacon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    build: ./deploy/backup
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  programme-root:
  ui-state:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
