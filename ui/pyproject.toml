[project]
name = "beacon-ui"
version = "0.1.0"
description = "Local web UI over the bcn pipeline CLI. Single user, localhost only."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beacon-ui = "beacon_ui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beacon_ui*"]

[tool.setuptools.package-data]
beacon_ui = ["static/*", "static/**/*"]
